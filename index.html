<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>한국사 기말고사형 퀴즈 (해방~1987)</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --card:#1a1a1a;
      --accent:#ffb86b;
      --muted:#c7c7c7;
      --glass: rgba(255,255,255,0.07);
    }
    html,body{
      height:100%;margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;
      background:#000;color:#fff;
    }
    .wrap{max-width:880px;margin:36px auto;padding:20px}
    header{display:flex;align-items:center;gap:16px}
    h1{margin:0;font-size:1.4rem}
    p.lead{margin:6px 0 18px;color:var(--muted)}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 30px rgba(0,0,0,0.9);}
    .controls{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    .controls input[type=number], .controls input[type=checkbox]{accent-color:var(--accent)}
    .controls input[type=number]{width:84px;padding:8px;border-radius:8px;border:1px solid #444;background:#111;color:#fff}
    .controls button{padding:8px 12px;border-radius:8px;border:0;background:linear-gradient(90deg,var(--accent),#ffd9a8);cursor:pointer;color:#000;font-weight:600}
    .meta{display:flex;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted)}
    .question-area{margin-top:8px}
    .qnum{font-size:.9rem;color:var(--muted)}
    .question{font-size:1.2rem;margin:8px 0 14px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choice{background:#111;padding:12px;border-radius:10px;cursor:pointer;border:1px solid #333;color:#fff;text-align:left}
    .choice:hover{transform:translateY(-3px);transition:transform .12s;background:#222}
    .choice.correct{outline:3px solid rgba(90,200,120,0.4);background:#143014}
    .choice.wrong{outline:3px solid rgba(255,80,80,0.4);background:#300}
    .explain{margin-top:12px;color:var(--muted);font-size:.95rem}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted)}
    .btns{display:flex;gap:8px}
    .btn{padding:8px 10px;border-radius:8px;border:0;background:#222;color:#fff;cursor:pointer}
    .btn:hover{background:#333}
    .hidden{display:none}
    @media (max-width:640px){.choices{grid-template-columns:1fr}.wrap{padding:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div style="width:56px;height:56px;border-radius:10px;background:linear-gradient(180deg,#ffb86b,#ffd9a8);display:flex;align-items:center;justify-content:center;color:#102133;font-weight:700">KH</div>
      <div>
        <h1>한국사 기말고사형 퀴즈 — 해방 ~ 1987</h1>
        <p class="lead">기말고사 스타일로 출제된 객관식 현대사 문제입니다. 40문제까지 선택 가능.</p>
      </div>
    </header>

    <section class="card" id="game">
      <div class="controls">
        <label for="num">문제 수:</label>
        <input id="num" type="number" min="1" max="70" value="10" />
        <label for="shuffle">문제 섞기</label>
        <input id="shuffle" type="checkbox" checked />
        <button id="start">게임 시작</button>
        <button id="restart" class="btn">초기화</button>
      </div>

      <div class="meta">
        <div class="qnum" id="qInfo">문제 0 / 0</div>
        <div class="scoreboard" id="score">점수: 0</div>
        <div style="margin-left:auto;color:var(--muted)">최고점: <span id="best">0</span></div>
      </div>

      <div class="question-area" id="qa">
        <div class="question" id="questionText">게임을 시작하세요.</div>
        <div class="choices" id="choices"></div>
        <div class="explain hidden" id="explainText"></div>
      </div>

      <div class="footer">
        <div class="btns">
          <button id="prev" class="btn">이전</button>
          <button id="next" class="btn">다음</button>
        </div>
        <div><button id="finish" class="btn">결과 보기</button></div>
      </div>
    </section>

    <footer class="small" style="color:var(--muted);margin-top:20px;text-align:center;font-size:.85rem">기말고사 스타일 40문제 현대사 퀴즈</footer>
  </div>

  <script>
    const QUESTIONS = [
  {q:"제2차 세계대전 중 연합국이 논의한 회담에서 한국 독립과 관련해 결정된 사항은?",choices:["독일 분할","한국 독립 약속","유럽 질서 재편","냉전 종식"],a:1,explain:"1943 카이로 회담에서 한국 독립을 약속했다."},
  {q:"얄타 회담에서 연합국이 논의한 사항 중 옳은 것은?",choices:["한국 즉시 독립","소련의 대일전 참전","UN 해체","한반도 중립화"],a:1,explain:"얄타 회담에서 소련의 대일전 참전이 결정되었다."},
  {q:"1945년 모스크바 3상회의에서 결정되지 않은 사항은?",choices:["신탁통치","임시정부 수립","미소공동위 구성","남북 통일정부 수립"],a:3,explain:"통일정부 수립은 포함되지 않았다."},
  {q:"미소공동위원회 결렬의 주된 원인은?",choices:["경제 문제","군사 문제","임시정부 참여 문제","휴전선 협상"],a:2,explain:"임정 참여 대상을 두고 미국과 소련이 대립했다."},
  {q:"1948년 5.10 총선거의 특징으로 옳은 것은?",choices:["남북 전체 선거","21세 이상 보통선거","대통령 직선","북한 참여"],a:1,explain:"남한에서만 21세 이상 보통·평등·직접·비밀선거가 시행되었다."},
  {q:"제헌헌법에서 대통령 선출 방식으로 적절한 것은?",choices:["직선제","국회 간선제","6년 중임제","내각책임제"],a:1,explain:"대통령은 국회에서 뽑았다."},
  {q:"남한 농지개혁의 시행 방식으로 옳은 것은?",choices:["무상몰수","유상매수·유상분배","지주권 강화","전면 국유화"],a:1,explain:"유상매수·유상분배로 진행되었다."},
  {q:"6.25 전쟁 직후 체결된 조약 중 올바른 것은?",choices:["가쓰라태프트","사이토협정","한미상호방위조약","경성조약"],a:2,explain:"1953 한미상호방위조약 체결."},
  {q:"1960년 3.15 부정선거로 이어진 사건은?",choices:["5.16 군사정변","4.19 혁명","10.26 사건","5.18 민주화운동"],a:1,explain:"4.19 혁명으로 이승만 하야."},
  {q:"1961년 5.16 군사정변을 주도한 인물은?",choices:["김대중","박정희","전두환","노태우"],a:1,explain:"박정희가 군사정변을 일으켰다."},
  {q:"유신헌법으로 강화된 대통령 권한은?",choices:["직선제","3선 금지","긴급조치권","의회권 강화"],a:2,explain:"대통령 권한을 대폭 강화했다."},
  {q:"긴급조치권이 행사된 시기 정권은?",choices:["이승만","박정희","최규하","전두환"],a:1,explain:"유신체제 박정희 정부의 권한."},
  {q:"1979년 부마항쟁이 발생한 지역은?",choices:["서울·대구","부산·마산","광주·목포","춘천·인제"],a:1,explain:"부산·마산에서 시작되었다."},
  {q:"1979년 10.26 사건으로 사망한 인물은?",choices:["노태우","전두환","박정희","장면"],a:2,explain:"중앙정보부 김재규가 박정희를 시해."},
  {q:"12.12 사태를 주도한 세력은?",choices:["장면","윤보선","전두환","노신영"],a:2,explain:"전두환 중심 신군부가 군권 장악."},
  {q:"1980년 5.18 민주화운동이 발생한 장소는?",choices:["부산","광주","서울","인천"],a:1,explain:"광주에서 민주화 시위 발생."},
  {q:"1987년 6월 민주항쟁으로 이루어진 성과는?",choices:["유신 부활","전두환 연임","대통령 직선제","국회 해산"],a:2,explain:"6.29 선언 → 대통령 직선제 도입."},
  {q:"대한민국 정부 수립일은?",choices:["1945","1947","1948","1949"],a:2,explain:"1948년 8월 15일 정부 수립."},
  {q:"반민특위 활동이 약화된 이유는?",choices:["예산 부족","대중 반대","경찰의 습격","이승만의 소극적 태도"],a:3,explain:"이승만의 소극적 태도로 반민특위 활동이 약화되었다."},
  {q:"장면 내각 출범의 계기가 된 사건은?",choices:["4.19 혁명","5.16 군사정변","6월 항쟁","부마항쟁"],a:0,explain:"4.19 이후 내각책임제가 도입되며 장면 내각 출범."},
  {q:"1950년대 한국전쟁 직후 한미상호방위조약 체결의 의의는?",choices:["한국 군사적 독립","미군 철수","안보보장 및 군사동맹","UN 가입"],a:2,explain:"1953년 체결되어 한국의 안보를 미국과의 동맹을 통해 보장했다."},
  {q:"이승만 정부가 장기집권을 위해 시행한 개헌 중 옳은 것은?",choices:["3선 제한 폐지","내각책임제 도입","직선제 폐지","연임 금지"],a:0,explain:"3선 개헌을 통해 이승만 대통령의 장기 집권이 가능해졌다."},
  {q:"1950~60년대 경제개발계획 수립과 관련된 정책은?",choices:["1차 경제개발 5개년 계획","2차 세계대전 참여","농지몰수","국유화 정책"],a:0,explain:"1960년대 이전부터 경제개발계획 수립 시도가 있었다."},
  {q:"1961년 군사정변 이후 신정부가 실시한 정책은?",choices:["유신헌법","경제개발 5개년 계획","국회 해산","3선 개헌"],a:1,explain:"박정희 정부가 경제개발 5개년 계획을 시작했다."},
  {q:"유신체제에서 긴급조치권이 사용된 이유는?",choices:["정치적 반대 세력 억압","경제 안정","교육 개혁","외교 협상"],a:0,explain:"정치적 반대세력을 억압하기 위해 사용되었다."},
  {q:"부마항쟁의 발생 배경으로 적절한 것은?",choices:["전두환 연임 반대","시민의 정치적 불만","경제 불황","국회 해산"],a:1,explain:"부산과 마산 시민들의 정치적 불만이 폭발하며 발생했다."},
  {q:"10.26 사건의 직접적 결과로 옳은 것은?",choices:["박정희 사망","전두환 즉시 집권","노태우 대통령 취임","유신헌법 폐지"],a:0,explain:"중앙정보부 김재규가 박정희 대통령을 시해하였다."},
  {q:"12.12 군사반란을 주도한 인물은?",choices:["윤보선","전두환","장면","최규하"],a:1,explain:"신군부 전두환 중심으로 군권을 장악했다."},
  {q:"1980년 5.18 민주화운동 당시 시민들이 요구한 것은?",choices:["유신체제 유지","정치적 자유와 민주화","경제개발계획 철회","국회 해산"],a:1,explain:"광주 시민들이 민주화를 요구하며 봉기했다."},
  {q:"1987년 6월 항쟁으로 달성된 정치적 성과는?",choices:["전두환 장기집권","직선제 대통령 도입","유신헌법 유지","내각책임제 도입"],a:1,explain:"6.29 선언으로 대통령 직선제가 도입되었다."},
  {q:"대한민국 최초 정부 수립 당시 대통령 선출 방식은?",choices:["직선제","국회 간선제","국민 투표제","유권자 선출"],a:1,explain:"제헌헌법에 따라 국회에서 대통령을 선출했다."},
  {q:"반민특위 활동이 약화된 원인으로 적절한 것은?",choices:["예산 부족","대중 반대","경찰의 습격","이승만의 소극적 태도"],a:3,explain:"이승만의 소극적 태도로 반민특위 활동이 약화되었다."},
  {q:"장면 내각이 출범하게 된 배경은?",choices:["4.19 혁명","5.16 군사정변","6월 항쟁","부마항쟁"],a:0,explain:"4.19 혁명 이후 내각책임제가 도입되어 출범했다."},
  {q:"1960년대 박정희 정부의 경제 정책 특징은?",choices:["농지 전면 국유화","경제개발 5개년 계획","소련과 경제협력","유신체제 유지"],a:1,explain:"경제성장을 위해 경제개발 5개년 계획을 추진했다."},
  {q:"1960년대 정치적 반대 세력 억압 수단으로 사용된 것은?",choices:["유신헌법","긴급조치권","3선 개헌","국회 해산"],a:1,explain:"긴급조치권을 활용해 정치적 반대세력을 억압했다."},
  {q:"부마항쟁이 민주화 운동으로 발전한 이유는?",choices:["경제 불황","정치적 탄압","사회 혼란","군사정권 지지"],a:1,explain:"부산과 마산 시민들의 정치적 탄압에 대한 저항이었다."},
  {q:"10.26 사건 이후 박정희 대통령을 대신해 권력을 장악한 세력은?",choices:["전두환 신군부","장면 내각","윤보선 정부","최규하 대통령"],a:0,explain:"전두환 중심 신군부가 군권을 장악했다."},
  {q:"12.12 사태와 관련된 결과로 적절한 것은?",choices:["유신헌법 폐지","신군부 집권","내각책임제 부활","경제개발 계획 중단"],a:1,explain:"전두환 신군부가 정치·군사 권력을 장악했다."},
  {q:"1980년 광주 민주화운동 당시 군의 대응 방식은?",choices:["평화적 협상","무력 진압","정치적 타협","경제 지원"],a:1,explain:"계엄군이 무력으로 진압하였다."},
  {q:"1987년 6월 항쟁 이후 대통령 직선제를 도입하게 된 배경은?",choices:["유신체제 연장","시민들의 민주화 요구","경제 위기","군사 정변"],a:1,explain:"시민들의 강력한 민주화 요구가 직선제 도입을 이끌었다."},
  {q:"포츠담 회담(1945)에서 일본에 요구된 핵심 사항은?",choices:["연합군 점령","무조건 항복","한국 독립 약속","독일 분할"],a:1,explain:"포츠담 회담에서 일본에게 무조건 항복을 요구하고 카이로 선언을 재확인했다."},

    const startBtn = document.getElementById('start');
    const restartBtn = document.getElementById('restart');
    const numInput = document.getElementById('num');
    const shuffleCheck = document.getElementById('shuffle');
    const qInfo = document.getElementById('qInfo');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const questionText = document.getElementById('questionText');
    const choicesEl = document.getElementById('choices');
    const explainEl = document.getElementById('explainText');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const finishBtn = document.getElementById('finish');

    let pool=[],current=0,score=0,answers=[];

    const BEST_KEY='kh_quiz_exam_v1';
    function loadBest(){bestEl.textContent=localStorage.getItem(BEST_KEY)||'0';}
    function saveBest(val){const b=Number(localStorage.getItem(BEST_KEY)||0);if(val>b)localStorage.setItem(BEST_KEY,val);}

    startBtn.onclick=()=>{
      let n=Math.min(70,Math.max(1,Number(numInput.value)||10));
      pool=QUESTIONS.slice();
      if(shuffleCheck.checked) pool.sort(()=>Math.random()-0.5);
      pool=pool.slice(0,n);
      current=0;score=0;answers=Array(n).fill(null);
      render();
    };
    restartBtn.onclick=()=>{pool=[];current=0;score=0;answers=[];renderIdle();};
    prevBtn.onclick=()=>{if(current>0){current--;render();}};
    nextBtn.onclick=()=>{if(current<pool.length-1){current++;render();}};
    finishBtn.onclick=()=>{
      if(!pool.length)return;
      let c=0;
      pool.forEach((q,i)=>{if(answers[i]===q.a)c++;});
      alert(`결과: ${c}/${pool.length} ${(c/pool.length*100).toFixed(1)}%`);
      saveBest(c);
    };

    function render(){
      loadBest();
      if(!pool.length){renderIdle();return;}
      qInfo.textContent=`문제 ${current+1} / ${pool.length}`;
      scoreEl.textContent=`점수: ${score}`;
      const item=pool[current];
      questionText.textContent=item.q;
      choicesEl.innerHTML='';
      explainEl.classList.add('hidden');
      item.choices.forEach((t,i)=>{
        const b=document.createElement('button');
        b.className='choice';b.textContent=`${i+1}. ${t}`;
        b.onclick=()=>select(i);
        choicesEl.appendChild(b);
      });
      if(answers[current]!==null) reveal();
    }
    function renderIdle(){qInfo.textContent='문제 0 / 0';scoreEl.textContent='점수: 0';questionText.textContent='게임을 시작하십시오.';choicesEl.innerHTML='';explainEl.classList.add('hidden');loadBest();}
    function select(i){if(answers[current]!==null)return;answers[current]=i;if(i===pool[current].a)score++;reveal();render();}
    function reveal(){const q=pool[current];const btns=[...choicesEl.querySelectorAll('.choice')];btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(answers[current]===i&&i!==q.a)b.classList.add('wrong');});explainEl.textContent='해설: '+q.explain;explainEl.classList.remove('hidden');}

    renderIdle(); loadBest();
  </script>
