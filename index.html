<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>한국사 퀴즈 — 균등 정답 분포 + 자동 넘김</title>
  <style>
    button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 10px;
  background: #333; /* 원래 사용하던 버튼 배경색 유지 */
  color: #fff;      /* ← 글자색을 흰색으로 변경 */
  font-size: 16px;
  cursor: pointer;
}

    :root{
      --bg:#0b0b0b;
      --card:#121212;
      --accent:#ffb86b;
      --muted:#c7c7c7;
      --glass: rgba(255,255,255,0.04);
    }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;background:#000;color:#fff}
    .wrap{max-width:980px;margin:28px auto;padding:18px}
    header{display:flex;gap:14px;align-items:center}
    h1{margin:0;font-size:1.3rem}
    p.lead{margin:6px 0 14px;color:var(--muted)}
    .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,0.8)}
    .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .controls input[type=number]{width:90px;padding:8px;border-radius:8px;border:1px solid #333;background:#0b0b0b;color:#fff}
    .controls button{padding:8px 12px;border-radius:8px;border:0;background:linear-gradient(90deg,var(--accent),#ffd9a8);cursor:pointer;color:#102133;font-weight:700}
    .meta{display:flex;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted);flex-wrap:wrap}
    .question-area{margin-top:6px}
    .qnum{font-size:.95rem;color:var(--muted)}
    .question{font-size:1.15rem;margin:10px 0 12px;line-height:1.4}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choice{background:var(--glass);padding:12px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);text-align:left}
    .choice:hover{transform:translateY(-3px);transition:transform .12s}
    .choice.correct{outline:3px solid rgba(90,200,120,0.35);background:linear-gradient(90deg,rgba(90,200,120,0.06),transparent)}
    .choice.wrong{outline:3px solid rgba(255,80,80,0.35);background:linear-gradient(90deg,rgba(255,80,80,0.04),transparent)}
    .explain{margin-top:12px;color:var(--muted);font-size:.95rem;white-space:pre-wrap}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);flex-wrap:wrap;gap:10px}
    .btns{display:flex;gap:8px;flex-wrap:wrap}
    .btn{padding:8px 10px;border-radius:8px;border:0;background:#222;color:#fff;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .timer{font-weight:700;color:var(--accent)}
    .center{display:flex;gap:8px;align-items:center}
    @media (max-width:640px){.choices{grid-template-columns:1fr}.wrap{padding:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div style="width:56px;height:56px;border-radius:10px;background:linear-gradient(180deg,#ffb86b,#ffd9a8);display:flex;align-items:center;justify-content:center;color:#102133;font-weight:700">KH</div>
      <div>
        <h1>한국사 퀴즈 — 균등 정답 분포 + 자동 넘김</h1>
        <p class="lead">정답 위치를 균등하게(0~3 인덱스 각각 17~18개) 재배치합니다. 정답이면 3초 뒤 자동 이동, 오답이면 해설 확인 후 직접 다음 클릭.</p>
      </div>
    </header>

    <section class="card" id="game">
      <div class="controls">
        <label for="num">문제 수:</label>
        <input id="num" type="number" min="1" max="70" value="20" />
        <label for="shuffle">문제 섞기</label>
        <input id="shuffle" type="checkbox" checked />
        <button id="start">게임 시작</button>
        <button id="restart" class="btn">초기화</button>
        <div style="margin-left:auto" class="center">
          <div>시간: <span class="timer" id="timer">00:00</span></div>
          <div style="margin-left:12px">맞힌수: <span id="correctCount">0</span>/<span id="totalCount">0</span></div>
        </div>
      </div>

      <div class="meta">
        <div class="qnum" id="qInfo">문제 0 / 0</div>
        <div class="scoreboard" id="score">점수: 0</div>
        <div style="margin-left:auto;color:var(--muted)">최고점: <span id="best">0</span></div>
      </div>

      <div class="question-area" id="qa">
        <div class="question" id="questionText">게임을 시작하세요.</div>
        <div class="choices" id="choices"></div>
        <div class="explain hidden" id="explainText"></div>
      </div>

      <div class="footer">
        <div class="btns">
          <button id="prev" class="btn">이전</button>
          <button id="next" class="btn">다음</button>
          <button id="retryWrongs" class="btn">오답만 다시 풀기</button>
        </div>
        <div class="center">
          <button id="finish" class="btn">결과 보기</button>
        </div>
      </div>
    </section>

    <footer style="color:var(--muted);margin-top:12px;text-align:center;font-size:.85rem">자동 재배치 + 자동 넘김 기능 포함. 모바일(안드/ios)에서도 동작합니다.</footer>
  </div>

  <script>
    // === 사용자가 붙여넣어 준 문제 배열 (70문제) ===
    const ORIGINAL_QUESTIONS = [
  {q:"제2차 세계대전 중 연합국이 논의한 회담에서 한국 독립과 관련해 결정된 사항은?",choices:["독일 분할","한국 독립 약속","유럽 질서 재편","냉전 종식"],a:1,explain:"1943 카이로 회담에서 한국 독립을 약속했다."},
  {q:"얄타 회담에서 연합국이 논의한 사항 중 옳은 것은?",choices:["한국 즉시 독립","소련의 대일전 참전","UN 해체","한반도 중립화"],a:1,explain:"얄타 회담에서 소련의 대일전 참전이 결정되었다."},
  {q:"1945년 모스크바 3상회의에서 결정되지 않은 사항은?",choices:["신탁통치","임시정부 수립","미소공동위 구성","남북 통일정부 수립"],a:3,explain:"통일정부 수립은 포함되지 않았다."},
  {q:"미소공동위원회 결렬의 주된 원인은?",choices:["경제 문제","군사 문제","임시정부 참여 문제","휴전선 협상"],a:2,explain:"임정 참여 대상을 두고 미국과 소련이 대립했다."},
  {q:"1948년 5.10 총선거의 특징으로 옳은 것은?",choices:["남북 전체 선거","21세 이상 보통선거","대통령 직선","북한 참여"],a:1,explain:"남한에서만 21세 이상 보통·평등·직접·비밀선거가 시행되었다."},
  {q:"제헌헌법에서 대통령 선출 방식으로 적절한 것은?",choices:["직선제","국회 간선제","6년 중임제","내각책임제"],a:1,explain:"대통령은 국회에서 뽑았다."},
  {q:"남한 농지개혁의 시행 방식으로 옳은 것은?",choices:["무상몰수","유상매수·유상분배","지주권 강화","전면 국유화"],a:1,explain:"유상매수·유상분배로 진행되었다."},
  {q:"6.25 전쟁 직후 체결된 조약 중 올바른 것은?",choices:["가쓰라태프트","사이토협정","한미상호방위조약","경성조약"],a:2,explain:"1953 한미상호방위조약 체결."},
  {q:"1960년 3.15 부정선거로 이어진 사건은?",choices:["5.16 군사정변","4.19 혁명","10.26 사건","5.18 민주화운동"],a:1,explain:"4.19 혁명으로 이승만 하야."},
  {q:"1961년 5.16 군사정변을 주도한 인물은?",choices:["김대중","박정희","전두환","노태우"],a:1,explain:"박정희가 군사정변을 일으켰다."},
  {q:"유신헌법으로 강화된 대통령 권한은?",choices:["직선제","3선 금지","긴급조치권","의회권 강화"],a:2,explain:"대통령 권한을 대폭 강화했다."},
  {q:"긴급조치권이 행사된 시기 정권은?",choices:["이승만","박정희","최규하","전두환"],a:1,explain:"유신체제 박정희 정부의 권한."},
  {q:"1979년 부마항쟁이 발생한 지역은?",choices:["서울·대구","부산·마산","광주·목포","춘천·인제"],a:1,explain:"부산·마산에서 시작되었다."},
  {q:"1979년 10.26 사건으로 사망한 인물은?",choices:["노태우","전두환","박정희","장면"],a:2,explain:"중앙정보부 김재규가 박정희를 시해."},
  {q:"12.12 사태를 주도한 세력은?",choices:["장면","윤보선","전두환","노신영"],a:2,explain:"전두환 중심 신군부가 군권 장악."},
  {q:"1980년 5.18 민주화운동이 발생한 장소는?",choices:["부산","광주","서울","인천"],a:1,explain:"광주에서 민주화 시위 발생."},
  {q:"1987년 6월 민주항쟁으로 이루어진 성과는?",choices:["유신 부활","전두환 연임","대통령 직선제","국회 해산"],a:2,explain:"6.29 선언 → 대통령 직선제 도입."},
  {q:"대한민국 정부 수립일은?",choices:["1945","1947","1948","1949"],a:2,explain:"1948년 8월 15일 정부 수립."},
  {q:"반민특위 활동이 약화된 이유는?",choices:["예산 부족","대중 반대","경찰의 습격","이승만의 소극적 태도"],a:3,explain:"이승만의 소극적 태도로 반민특위 활동이 약화되었다."},
  {q:"장면 내각 출범의 계기가 된 사건은?",choices:["4.19 혁명","5.16 군사정변","6월 항쟁","부마항쟁"],a:0,explain:"4.19 이후 내각책임제가 도입되며 장면 내각 출범."},
  {q:"1950년대 한국전쟁 직후 한미상호방위조약 체결의 의의는?",choices:["한국 군사적 독립","미군 철수","안보보장 및 군사동맹","UN 가입"],a:2,explain:"1953년 체결되어 한국의 안보를 미국과의 동맹을 통해 보장했다."},
  {q:"이승만 정부가 장기집권을 위해 시행한 개헌 중 옳은 것은?",choices:["3선 제한 폐지","내각책임제 도입","직선제 폐지","연임 금지"],a:0,explain:"3선 개헌을 통해 이승만 대통령의 장기 집권이 가능해졌다."},
  {q:"1950~60년대 경제개발계획 수립과 관련된 정책은?",choices:["1차 경제개발 5개년 계획","2차 세계대전 참여","농지몰수","국유화 정책"],a:0,explain:"1960년대 이전부터 경제개발계획 수립 시도가 있었다."},
  {q:"1961년 군사정변 이후 신정부가 실시한 정책은?",choices:["유신헌법","경제개발 5개년 계획","국회 해산","3선 개헌"],a:1,explain:"박정희 정부가 경제개발 5개년 계획을 시작했다."},
  {q:"유신체제에서 긴급조치권이 사용된 이유는?",choices:["정치적 반대 세력 억압","경제 안정","교육 개혁","외교 협상"],a:0,explain:"정치적 반대세력을 억압하기 위해 사용되었다."},
  {q:"부마항쟁의 발생 배경으로 적절한 것은?",choices:["전두환 연임 반대","시민의 정치적 불만","경제 불황","국회 해산"],a:1,explain:"부산과 마산 시민들의 정치적 불만이 폭발하며 발생했다."},
  {q:"10.26 사건의 직접적 결과로 옳은 것은?",choices:["박정희 사망","전두환 즉시 집권","노태우 대통령 취임","유신헌법 폐지"],a:0,explain:"중앙정보부 김재규가 박정희 대통령을 시해하였다."},
  {q:"12.12 군사반란을 주도한 인물은?",choices:["윤보선","전두환","장면","최규하"],a:1,explain:"신군부 전두환 중심으로 군권을 장악했다."},
  {q:"1980년 5.18 민주화운동 당시 시민들이 요구한 것은?",choices:["유신체제 유지","정치적 자유와 민주화","경제개발계획 철회","국회 해산"],a:1,explain:"광주 시민들이 민주화를 요구하며 봉기했다."},
  {q:"1987년 6월 항쟁으로 달성된 정치적 성과는?",choices:["전두환 장기집권","직선제 대통령 도입","유신헌법 유지","내각책임제 도입"],a:1,explain:"6.29 선언으로 대통령 직선제가 도입되었다."},
  {q:"대한민국 최초 정부 수립 당시 대통령 선출 방식은?",choices:["직선제","국회 간선제","국민 투표제","유권자 선출"],a:1,explain:"제헌헌법에 따라 국회에서 대통령을 선출했다."},
  
  {q:"장면 내각이 출범하게 된 배경은?",choices:["4.19 혁명","5.16 군사정변","6월 항쟁","부마항쟁"],a:0,explain:"4.19 혁명 이후 내각책임제가 도입되어 출범했다."},
  {q:"1960년대 박정희 정부의 경제 정책 특징은?",choices:["농지 전면 국유화","경제개발 5개년 계획","소련과 경제협력","유신체제 유지"],a:1,explain:"경제성장을 위해 경제개발 5개년 계획을 추진했다."},
  {q:"1960년대 정치적 반대 세력 억압 수단으로 사용된 것은?",choices:["유신헌법","긴급조치권","3선 개헌","국회 해산"],a:1,explain:"긴급조치권을 활용해 정치적 반대세력을 억압했다."},
  {q:"부마항쟁이 민주화 운동으로 발전한 이유는?",choices:["경제 불황","정치적 탄압","사회 혼란","군사정권 지지"],a:1,explain:"부산과 마산 시민들의 정치적 탄압에 대한 저항이었다."},
  {q:"10.26 사건 이후 박정희 대통령을 대신해 권력을 장악한 세력은?",choices:["전두환 신군부","장면 내각","윤보선 정부","최규하 대통령"],a:0,explain:"전두환 중심 신군부가 군권을 장악했다."},
  {q:"12.12 사태와 관련된 결과로 적절한 것은?",choices:["유신헌법 폐지","신군부 집권","내각책임제 부활","경제개발 계획 중단"],a:1,explain:"전두환 신군부가 정치·군사 권력을 장악했다."},
  {q:"1980년 광주 민주화운동 당시 군의 대응 방식은?",choices:["평화적 협상","무력 진압","정치적 타협","경제 지원"],a:1,explain:"계엄군이 무력으로 진압하였다."},

    // === UI 요소 ===
    const startBtn = document.getElementById('start');
    const restartBtn = document.getElementById('restart');
    const numInput = document.getElementById('num');
    const shuffleCheck = document.getElementById('shuffle');
    const qInfo = document.getElementById('qInfo');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const questionText = document.getElementById('questionText');
    const choicesEl = document.getElementById('choices');
    const explainEl = document.getElementById('explainText');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const finishBtn = document.getElementById('finish');
    const timerEl = document.getElementById('timer');
    const correctCountEl = document.getElementById('correctCount');
    const totalCountEl = document.getElementById('totalCount');
    const retryWrongsBtn = document.getElementById('retryWrongs');

    // 게임 상태
    let QUESTIONS = []; // 재배치 후 실제 사용할 문제
    let pool = [];      // 현재 세션 문제 (slice)
    let current = 0;
    let score = 0;
    let answers = [];   // 사용자가 선택한 인덱스 or null
    let autoNextTimer = null;
    let overallTimer = null;
    let startTime = null;
    let endTime = null;
    const BEST_KEY = 'kh_quiz_best_v3';

    // 로컬스토리지 최고점
    function loadBest(){ bestEl.textContent = localStorage.getItem(BEST_KEY) || '0'; }
    function saveBest(v){ const prev = Number(localStorage.getItem(BEST_KEY)||0); if(v>prev) localStorage.setItem(BEST_KEY,String(v)); loadBest(); }

    // --- 정답 인덱스 균등 분배 함수 ---
    // 목표 분포: 총 N 문제에 대해 인덱스 0~3이 가능한 한 균등하게 분포하도록 할당
    function redistributeAnswerPositions(originalQs){
      const N = originalQs.length;
      // 원하는 분포: 차례대로  Math.floor(N/4) 또는 Math.ceil
      const base = Math.floor(N/4); // 17 for 70 -> 17
      const remainder = N - base*4; // 70 - 68 = 2 -> remain 2 indices get +1 => two indexes 18
      const desired = [base, base, base, base];
      for(let i=0;i<remainder;i++) desired[i]++; // e.g. desired = [18,18,17,17]

      // 만들고 섞기
      const targetIndices = [];
      for(let idx=0;idx<4;idx++){
        for(let k=0;k<desired[idx];k++) targetIndices.push(idx);
      }
      // 섞기 랜덤화
      for(let i=targetIndices.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [targetIndices[i], targetIndices[j]] = [targetIndices[j], targetIndices[i]];
      }

      // 이제 각 문제에 대해 'target index'를 하나씩 꺼내서 그 위치에 정답이 오도록 choices 재배치
      const newQs = [];
      for(let i=0;i<originalQs.length;i++){
        const q = originalQs[i];
        const target = targetIndices[i];
        const correctText = q.choices[q.a];
        // other choices in original order excluding correct
        const others = q.choices.filter((c, idx) => idx !== q.a);
        // build new choices with correctText inserted at target
        const newChoices = [];
        let oi = 0;
        for(let pos=0; pos<4; pos++){
          if(pos === target) newChoices.push(correctText);
          else { newChoices.push(others[oi]); oi++; }
        }
        newQs.push({
          q: q.q,
          choices: newChoices,
          a: target,
          explain: q.explain
        });
      }
      return newQs;
    }

    // --- 시간 표시 ---
    function formatTime(ms){
      if(!ms) return "00:00";
      const s = Math.floor(ms/1000);
      const mm = Math.floor(s/60).toString().padStart(2,'0');
      const ss = (s%60).toString().padStart(2,'0');
      return `${mm}:${ss}`;
    }

    function startOverallTimer(){
      startTime = Date.now();
      timerEl.textContent = formatTime(0);
      if(overallTimer) clearInterval(overallTimer);
      overallTimer = setInterval(()=>{
        timerEl.textContent = formatTime(Date.now()-startTime);
      }, 250);
    }
    function stopOverallTimer(){
      if(overallTimer) clearInterval(overallTimer);
      endTime = Date.now();
      timerEl.textContent = formatTime(endTime - startTime);
    }

    // --- 렌더링 ---
    function renderIdle(){
      qInfo.textContent = '문제 0 / 0';
      scoreEl.textContent = '점수: 0';
      questionText.textContent = '게임을 시작하려면 [게임 시작]을 누르세요.';
      choicesEl.innerHTML = '';
      explainEl.classList.add('hidden');
      correctCountEl.textContent = '0';
      totalCountEl.textContent = '0';
      timerEl.textContent = '00:00';
      loadBest();
    }

    function render(){
      loadBest();
      if(!pool.length){ renderIdle(); return; }
      qInfo.textContent = `문제 ${current+1} / ${pool.length}`;
      scoreEl.textContent = `점수: ${score}`;
      totalCountEl.textContent = pool.length;
      correctCountEl.textContent = pool.reduce((acc,_,i)=> acc + (answers[i]===pool[i].a?1:0), 0);

      const item = pool[current];
      questionText.textContent = item.q;
      choicesEl.innerHTML = '';
      explainEl.classList.add('hidden');

      item.choices.forEach((c, idx)=>{
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = `${idx+1}. ${c}`;
        btn.disabled = (answers[current] !== null); // disable if already answered
        btn.addEventListener('click', ()=> onSelect(idx));
        choicesEl.appendChild(btn);
      });

      // 만약 이미 답한 문제라면 결과 표시
      if(answers[current] !== null){
        revealAnswer(current);
      }
      // next/prev disabled 처리
      prevBtn.disabled = (current === 0);
      nextBtn.disabled = (current >= pool.length -1);
    }

    // --- 선택 처리 ---
    function onSelect(choiceIndex){
      if(answers[current] !== null) return;
      const q = pool[current];
      answers[current] = choiceIndex;
      const correct = (choiceIndex === q.a);
      if(correct){
        score++;
        scoreEl.textContent = `점수: ${score}`;
      }
      revealAnswer(current, correct);
      // 정답이면 자동으로 3초 뒤 다음 (단, 마지막 문제면 자동 종료하지 않음; 그냥 결과 버튼 활성)
      if(choiceIndex === q.a){
        if(current < pool.length -1){
          autoNextTimer = setTimeout(()=> {
            current++;
            render();
          }, 3000);
        } else {
          // 마지막 문제 정답: 멈추고 타이머 정지(게임 완료)
          stopOverallTimer();
          saveBest(score);
          alert(`마지막 문제 정답! 결과: ${score}/${pool.length} (${(score/pool.length*100).toFixed(1)}%)\n총 소요시간: ${timerEl.textContent}`);
        }
      } else {
        // 오답이면 멈추고 해설 표시 (사용자가 직접 다음 클릭)
        if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = null; }
      }
      correctCountEl.textContent = pool.reduce((acc,_,i)=> acc + (answers[i]===pool[i].a?1:0), 0);
    }

    function revealAnswer(idx, justAnsweredCorrect){
      const q = pool[idx];
      const buttons = [...choicesEl.querySelectorAll('.choice')];
      buttons.forEach((b, i)=>{
        b.disabled = true;
        if(i === q.a) b.classList.add('correct');
        if(answers[idx] === i && i !== q.a) b.classList.add('wrong');
      });
      explainEl.textContent = `해설: ${q.explain}`;
      explainEl.classList.remove('hidden');
    }

    // --- 이벤트 바인딩 ---
    startBtn.addEventListener('click', ()=>{
      // prepare QUESTIONS rebalanced
      QUESTIONS = redistributeAnswerPositions(ORIGINAL_QUESTIONS);
      // optional shuffle of question order before slicing
      if(shuffleCheck.checked) QUESTIONS.sort(()=>Math.random()-0.5);
      const n = Math.min(70, Math.max(1, Number(numInput.value) || 20));
      pool = QUESTIONS.slice(0, n);
      current = 0;
      score = 0;
      answers = Array(pool.length).fill(null);
      // start overall timer
      startOverallTimer();
      render();
    });

    restartBtn.addEventListener('click', ()=>{
      if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = null; }
      if(overallTimer){ clearInterval(overallTimer); overallTimer = null; }
      pool = [];
      current = 0;
      score = 0;
      answers = [];
      renderIdle();
    });

    prevBtn.addEventListener('click', ()=>{
      if(current>0){
        if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = null; }
        current--;
        render();
      }
    });
    nextBtn.addEventListener('click', ()=>{
      if(current < pool.length -1){
        if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = null; }
        current++;
        render();
      } else {
        // 마지막 문제에서 수동으로 '다음' 누르면 결과 보기
        finishBtn.click();
      }
    });

    finishBtn.addEventListener('click', ()=>{
      if(!pool.length) return;
      if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = null; }
      stopOverallTimer();
      let correctCount = pool.reduce((acc,q,i)=> acc + (answers[i]===q.a?1:0), 0);
      saveBest(correctCount);
      alert(`시험 종료\n결과: ${correctCount} / ${pool.length} (${(correctCount/pool.length*100).toFixed(1)}%)\n총 소요시간: ${timerEl.textContent}`);
    });

    // 오답만 다시 풀기 모드
    retryWrongsBtn.addEventListener('click', ()=>{
      const wrongIndices = pool.map((q,i)=> ({i, wrong: answers[i]===q.a})).filter(x=>!x.wrong).map(x=>x.i);
      if(wrongIndices.length === 0){ alert('오답이 없습니다.'); return; }
      // build new pool of only wrong questions
      const newPool = wrongIndices.map(i => pool[i]);
      pool = newPool;
      current = 0;
      score = 0;
      answers = Array(pool.length).fill(null);
      // restart timer
      startOverallTimer();
      render();
    });

    // 초기화
    renderIdle();
    loadBest();
  </script>
</body>
</html>
